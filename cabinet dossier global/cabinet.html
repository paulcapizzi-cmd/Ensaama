<html>

  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="fake-sphere.js"></script>
    <script src="fake-room.js"></script>
    <script src="fake-ground.js"></script>
    <script src="look-audio.js"></script>
    <script src="tv-filter.js"></script>
    <script src="fake-sea.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="claviersouris" src="3d\claviersouris.glb"></a-asset-item>
        <a-asset-item id="feuilleporte" src="3d\feuilleporte.glb"></a-asset-item>
        <a-asset-item id="feuillesattelite" src="3d\feuillesattelite.glb"></a-asset-item>
        <a-asset-item id="pilepapier" src="3d\pilepapier.glb"></a-asset-item>
        <a-asset-item id="bureau" src="3d/bureau.glb"></a-asset-item>
        <a-asset-item id="tasse" src="3d/tasse.glb"></a-asset-item>
        <a-asset-item id="tele1" src="3d/tele1.glb"></a-asset-item>
        <a-asset-item id="tele2" src="3d/tele2.glb"></a-asset-item>

        <img id="paysagepanofondnoir" src="image/paysagepanofondnoir.png">
        <img id="espace" src="image/espace.png">
        <img id="satellite" src="image/satellite.png">
        <img id="sollune" src="image/sollune.png">
        <img id="ciel" src="image\ciel2.png">
        <img id="couloir1" src="image/couloir1.png">
        <img id="livres" src="image/livres.png">
        <img id="sol" src="image/sol.png">

        <audio id="audioastronaute" src="audio/audioastronaute.mp3" preload="auto"></audio>
        <audio id="audiocouloir" src="audio/audiocouloir.mp3" preload="auto"></audio>
        <audio id="audiocouloirbruit" src="audio/audiocouloirbruit.mp3" preload="auto"></audio>
        <audio id="audiovent" src="audio/audiovent.mp3" preload="auto"></audio>
        <audio id="audioorage" src="audio/audioorage.mp3" preload="auto"></audio>

      </a-assets>
      
      <!-- CAMERA ET LAMPE TORCHE -->
      
      <a-entity camera look-controls wasd-controls="acceleration: 15" position="0 1.6 0">
      <a-entity  light="type: spot; angle: 60; color: #f0ffad;intensity: 0; distance: 40; decay: 5; penumbra:1"
                  animation__eteint="property: light.intensity; from: 0; to: 5; delay: 21500; dur: 100; easing: linear">
                  </a-entity>
      </a-entity> 

      <!-- MURS, SOL ET PLAFOND -->

      <a-plane position="0 0 -1" rotation="-90 180 180" width="4" height="4" material="side: double; src:#sol;"></a-plane>
      <a-plane position="0 4 -1" rotation="-90 180 180" width="4" height="4" color="black" material="side: double"></a-plane>
      <a-plane position="2 2 -1" width="4" height="4" color="black" material="shader: flat; color: #000; side: double" rotation="0 90 0" ></a-plane>
      <a-plane position="-2 2 -1" width="4" height="4" color="black" material="shader: flat; color: #000; side: double" rotation="0 90 0"></a-plane>
      <a-plane position="0 2 1" width="4" height="4" color="black" material="shader: flat; color: #000; side: double" ></a-plane>
      <a-plane position="0 2 -3" width="4" height="4" color="black" material="shader: flat; color: #000; side: double" ></a-plane>

      <!-- MODELES 3D -->

      <a-entity gltf-model="#claviersouris" position="-0.1 1.12 -2.2" scale="1 1 1" ></a-entity>
      <a-entity gltf-model="#feuilleporte" position="0.596 1.121 -2.306" rotation="0 -25.58 0"></a-entity>
      <a-entity gltf-model="#livres" position="0.596 1.121 -2.306" rotation="0 -25.58 0"></a-entity>
      <a-entity gltf-model="#pilepapier" position="-0.474 1.121 -2.67" rotation="0 -44.6 0"></a-entity>
      <a-entity gltf-model="#bureau" position="0 0.8 -2.417" scale="0.5 0.5 0.7" ></a-entity>
      <a-entity gltf-model="#tasse" position="-0.8 1.117 -2.293" scale="0.5 0.5 0.5" rotation="0 55 0"></a-entity>

      <!-- SONS -->

      <a-entity sound="src: #audioorage; on: animationcomplete; positional: false"
          animation="property: scale; from: 1 1 1; to: 1.001 1.001 1.001; dur: 100; delay: 16000"></a-entity>

        
      <!-- PAYSAGE -->


      <a-entity gltf-model="#tele1" position="0 2 -2.7" scale="0.7 0.7 0.7" rotation="5 0 0" >

        <a-plane position="0 0 0.03" width="2.6" height="1.6" material="metalness: 0.7; color: #000; transparent: true; opacity: 0"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 7000; dur: 120; dir: alternate; loop: 2; easing: linear"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: material.opacity; from: 0; to: 1; delay: 20000; dur: 100; easing: linear"></a-plane>

        <a-entity fake-sphere="src: #paysagepanofondnoir; width: 2.6; height: 1.5; radius: 500; depth: 200;
                  lightEl: #lampe0; lightColor: #FFFFFF; lightIntensity: 3; lightRange: 250; ambient: 0.2;"
                  position="0 0 0.015"></a-entity>

        <a-entity light="type: point; color:  #6674F0; intensity: 1; distance: 1.5; decay: 1"
                  position="0 0 0.3"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 7000; dur: 120; dir: alternate; loop: 2; easing: linear"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 1; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>

      </a-entity>


      <!-- COULOIR -->

      
      <a-entity gltf-model="#tele1" position="1.5 1.8 -2.3" scale="0.4 1.2 0.62" rotation="5 -35 0">

        <a-plane position="0 0 0.03" width="2.6" height="1.5" material="metalness: 0.7; color: #000; transparent: true; opacity: 0"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 5000; dur: 120; dir: alternate; loop: 4; easing: linear"
                  animation__clignote2="property: material.opacity; from: 0; to: 1; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: material.opacity; from: 0; to: 1; delay: 20000; dur: 100; easing: linear"></a-plane>

        <a-entity look-audio="src: #audiocouloir; angle: 20; fadeIn: 1.5; fadeOut: 2; volume: 0.5; activeUntil: 20000"
                   position="0 0 0.015"></a-entity>

        <a-entity look-audio="src: #audiocouloirbruit; angle: 20; fadeIn: 1.5; fadeOut: 2; volume: 0.5"
                  position="0 0 0.015"></a-entity>

        <a-entity fake-room="src: #couloir1; width: 2.6; height: 1.5; depth: 2;
                  backWidth: 0; backHeight: 0; backBottom: 0; backX: 0; tile: false;
                  lightEl: #lampe; lightColor: #FFFFFF; lightIntensity: 20;
                  lightRange: 1.7; ambient: 0.05; flicker: 0.25; flickerMin: 0.2; flickerMax: 4"
                  position="0 0 0.015"></a-entity>

        <a-entity id="lampe" position="0 0.5 -1"></a-entity>

        <a-entity light="type: point; color: #E66815; intensity: 1; distance: 0.8; decay:   1"
                  position="0 -0.5 0.4"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 1; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>

        <a-entity light="type: point; color: #E66815; intensity: 2; distance: 0.5; decay: 1"
                  position="0 0.5 0.3"
                  animation__clignote="property: light.intensity; from: 2; to: 0; delay: 5000; dur: 120; dir: alternate; loop: 4; easing: linear"
                  animation__clignote2="property: light.intensity; from: 2; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 2; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>

      </a-entity>


      <!-- ESPACE -->


      <a-entity gltf-model="#tele1" position="1.95 1.8 -1" scale="0.6 0.6 0.6" rotation="0 270 0" tv-filter="preset: noirblanc; grain: 0.1; vignette: 0.9">

        <a-plane position="0 0 0.03" width="2.6" height="1.6" material="metalness: 0.7; color: #000; transparent: true; opacity: 0"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 13000; dur: 120; dir: alternate; loop: 2; easing: linear"
                  animation__clignote2="property: material.opacity; from: 0; to: 1; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: material.opacity; from: 0; to: 1; delay: 20000; dur: 100; easing: linear"></a-plane>

        <a-entity look-audio="src: #audioastronaute; angle: 20; fadeIn: 1.5; fadeOut: 2; volume: 0.8; activeUntil: 20000"
                  position="0 0 0.015"></a-entity>

        <a-entity fake-sphere="src: #espace; width: 2.6; height: 1.5; radius: 300; depth: 200; backColor: black;
                  lightEl: #lampeespace; lightColor: #FFFEFE; lightIntensity: 5;
                  lightRange: 150; ambient: 0;"
                  position="0 0 0.015"></a-entity>

        <a-entity id="lampeespace" position="0 0 -490"></a-entity>

        <a-entity fake-sphere="src: #satellite; width: 2.6; height: 1.5; radius: 30; depth: 30; offsetY: 13;
                  lightEl: #lampesatellite; lightColor: #FFFFFF; lightIntensity: 10;
                  lightRange: 8; ambient: 0;"
                  position="0 0 0.015"></a-entity>

        <a-entity id="lampesatellite" position="0 5 -56"></a-entity>

        <a-entity fake-ground="src: #sollune; width: 2.6; height: 1.5; tileSize: 15; fadeFar: 50; offsetY: 7.5; floorY: -3; tileShift: 0.5; tileRotate: 90 180 270 ;
                  lightEl: #lampelune; lightColor: #FFFDFD; lightIntensity: 1;
                  lightRange: 15; lightSoftness: 1; ambient: 0;"
                  position="0 0 0.015"></a-entity>

        <a-entity id="lampelune" position="0 0 -5"></a-entity>

        <a-entity light="type: point; color:  #FCFCFD; intensity: 1; distance: 1.5; decay: 1"
                  position="0 0 0.3"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 13000; dur: 120; dir: alternate; loop: 2; easing: linear"
                  animation__clignote2="property: light.intensity; from: 1; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 1; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>
            
        <a-entity gltf-model="#feuillesattelite" position="-1.1 -1.08 0.08" rotation="90 0 0"></a-entity>
        

      </a-entity>


      <!-- MER -->


      <a-entity gltf-model="#tele2" position="-1.4 1.8 -2.30" scale="1 1 1" rotation="5 35 0">

        <a-plane position="0 0 0.02" width="1" height="1.7" material="metalness: 0.7; color: #000; transparent: true; opacity: 0"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: material.opacity; from: 0; to: 1; delay: 20000; dur: 100; easing: linear"></a-plane>

        <a-entity look-audio="src: #audiovent; angle: 20; fadeIn: 1.5; fadeOut: 2; volume: 0.3; activeUntil: 20000"
                  position="0 0 0.015"></a-entity>

        <a-entity fake-sea="width: 0.9; height: 1.6; skySrc: #ciel; lightEl: #soleil; floorY:0; waveSpeed:0.5; tilt: 5;" position="0 0 0.015"></a-entity>

        <a-entity fake-sphere="src: #ciel; width: 0.9; height: 1.6; radius: 1000; depth: 0; offsetY:35;
            hazeAmount: 0; hazeColor: #030303; hazeNear: 0; hazeFar: 30"
            position="0 0 0.015"></a-entity>

        <a-entity id="soleil" position="30 0 -620"></a-entity>

        <a-entity light="type: point; color: #C0CCD1; intensity: 1; distance: 0.8; decay: 1"
                  position="0 -0.5 0.2"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 1; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>

      </a-entity>


      <!-- LIVRES -->


      <a-entity gltf-model="#tele1" position="-1.95 2.2 -1.4" scale="0.4 0.4 0.4" rotation="10 90 0" >

        <a-plane position="0 0 0.02" width="2.6" height="1.6" material="metalness: 0.7; color: #000; transparent: true; opacity: 0"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 10000; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__clignote="property: material.opacity; from: 0; to: 1; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: material.opacity; from: 0; to: 1; delay: 20000; dur: 100; easing: linear"></a-plane>

        <a-entity fake-room="src: #livres; width: 2.6; height: 1.5; depth:1; backBottom: 0; backX: 0"
                  position="0 0 0.015"></a-entity>

        <!-- <a-entity id="lampe0" position="0 0 -620"></a-entity> -->
          
        <a-entity light="type: point; color:  #FDB850; intensity: 1; distance: 1; decay: 1"
                  position="0 0 0.3"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 10000; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__clignote="property: light.intensity; from: 1; to: 0; delay: 19500; dur: 120; dir: alternate; loop: 6; easing: linear"
                  animation__eteint="property: light.intensity; from: 1; to: 0; delay: 20000; dur: 100; easing: linear">
                  </a-entity>

      </a-entity>

      
      <!-- AUTRES TELES -->


      <a-entity gltf-model="#tele1" position="1 3.4 -2.2" scale="0.6 0.6 0.6" rotation="30 -20 0">
       <a-plane position="0 0 0.02" width="2.6" height="1.5" material="metalness: 0.7; color: #000"></a-plane>
      </a-entity>

      <a-entity gltf-model="#tele1" position="-1.996 1 -1.068" scale="0.6 0.6 0.6" rotation="0 90 0">
      <a-plane position="0 0 0.02" width="2.6" height="1.6" material="metalness: 0.7; color: #000"></a-plane>
      </a-entity>

      <a-entity gltf-model="#tele1" position="-1 3.2 -2.2" scale="0.6 0.6 0.6" rotation="30 20 0">
      <a-plane position="0 0 0.02" width="2.6" height="1.5" material="metalness: 0.7; color: #000"></a-plane>
      </a-entity>
      
      
    </a-scene>

      for (const attr of el.getAttributeNames()) {
        if (!attr.startsWith('animation')) continue;
        const d = el.getAttribute(attr).delay;
        if (d) el.setAttribute(attr, 'delay', Math.max(0, d - SKIP));
      }
    });
  });
</script> -->
  </body>
  
</html>
